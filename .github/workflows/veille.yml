name: Veille technologique

# Met à jour mockup/js/veille-data.json à partir des flux cyber (CERT-FR + presse).
# Tourne tout seul 2×/jour ; lançable aussi à la main depuis l'onglet Actions.
on:
  schedule:
    - cron: '17 6,18 * * *'   # 06:17 et 18:17 UTC, chaque jour
  workflow_dispatch:            # bouton « Run workflow » manuel

# Autorise le job à committer le JSON régénéré dans le repo.
permissions:
  contents: write

# Évite deux exécutions simultanées qui se marcheraient dessus.
concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer la veille
        run: node mockup/tools/build-veille.js

      - name: Compléter les images du bloc Impact
        # veille-impact.json est écrit à la main (voir le fichier) : ce script
        # ne touche que son champ `image`, pour les entrées qui n'en ont pas
        # encore — jamais le flux principal ni les fichiers déjà renseignés.
        run: node mockup/tools/build-veille-impact.js

      - name: Committer si le contenu a changé
        run: |
          # On suit aussi les images rapatriées (assets/veille/ pour le flux,
          # assets/veille-impact/ pour le bloc Impact) : les JSON y référencent
          # des chemins locaux, il faut donc committer les fichiers avec,
          # sinon les vignettes pointent dans le vide.
          git add -A mockup/js/veille-data.json mockup/assets/veille mockup/js/veille-impact.json mockup/assets/veille-impact
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à committer."
            exit 0
          fi
          git config user.name  "veille-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(veille): mise à jour automatique du flux"
          git push
