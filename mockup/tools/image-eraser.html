<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gomme d'image (détourage manuel)</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    background: #1e1f22;
    color: #eee;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar {
    width: 260px;
    flex: 0 0 260px;
    padding: 16px;
    background: #2a2b2f;
    box-sizing: border-box;
    overflow-y: auto;
    border-right: 1px solid #444;
  }
  #sidebar h1 { font-size: 15px; margin: 0 0 12px; }
  #sidebar label { display: block; margin-top: 14px; font-size: 12px; color: #aaa; }
  #sidebar input[type="range"] { width: 100%; }
  #sidebar button, #sidebar input[type="file"]::file-selector-button {
    background: #3d7eff; color: white; border: none; border-radius: 6px;
    padding: 8px 12px; cursor: pointer; font-size: 13px; margin-top: 6px;
  }
  #sidebar button:hover { background: #2f66d8; }
  #sidebar button.secondary { background: #555; }
  #sidebar button.secondary:hover { background: #444; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row button { flex: 1; }
  #status { font-size: 12px; color: #8f8; margin-top: 10px; white-space: pre-wrap; }
  #canvasWrap {
    flex: 1;
    position: relative;
    overflow: auto;
    background:
      linear-gradient(45deg, #444 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(-45deg, #444 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(45deg, transparent 75%, #444 75%) -8px 0/16px 16px,
      linear-gradient(-45deg, transparent 75%, #444 75%) -8px 0/16px 16px,
      #666;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }
  #stageInner { position: relative; margin: auto; }
  canvas { display: block; image-rendering: pixelated; }
  #cursorRing {
    position: fixed; pointer-events: none;
    border: 1px solid #fff; border-radius: 50%;
    mix-blend-mode: difference; z-index: 5;
  }
  small.hint { display:block; margin-top: 4px; color:#777; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>Gomme d'image</h1>
    <label>Ouvrir une image
      <input type="file" id="fileInput" accept="image/*">
    </label>
    <small class="hint">Glisser-déposer une image marche aussi.</small>

    <label>Taille du pinceau: <span id="brushVal">30</span>px
      <input type="range" id="brushSize" min="2" max="150" value="30">
    </label>

    <label>Zoom: <span id="zoomVal">100</span>%
      <input type="range" id="zoom" min="25" max="800" value="100">
    </label>

    <label>Mode</label>
    <div class="row">
      <button id="modeErase" class="active">Gomme (effacer)</button>
      <button id="modeRestore" class="secondary">Restaurer</button>
    </div>

    <div class="row">
      <button id="undoBtn" class="secondary">Annuler (Ctrl+Z)</button>
      <button id="resetBtn" class="secondary">Reset image</button>
    </div>

    <label>Rogner et exporter</label>
    <div class="row">
      <button id="cropBtn" class="secondary">Rogner au contenu</button>
    </div>
    <div class="row">
      <button id="downloadBtn">Télécharger le PNG</button>
    </div>

    <div id="status"></div>
  </div>

  <div id="canvasWrap">
    <div id="stageInner">
      <canvas id="stage"></canvas>
    </div>
  </div>
  <div id="cursorRing"></div>

<script>
const fileInput = document.getElementById('fileInput');
const stage = document.getElementById('stage');
const stageInner = document.getElementById('stageInner');
const canvasWrap = document.getElementById('canvasWrap');
const ctx = stage.getContext('2d', { willReadFrequently: true });
const brushSize = document.getElementById('brushSize');
const brushVal = document.getElementById('brushVal');
const zoomInput = document.getElementById('zoom');
const zoomVal = document.getElementById('zoomVal');
const modeErase = document.getElementById('modeErase');
const modeRestore = document.getElementById('modeRestore');
const undoBtn = document.getElementById('undoBtn');
const resetBtn = document.getElementById('resetBtn');
const cropBtn = document.getElementById('cropBtn');
const downloadBtn = document.getElementById('downloadBtn');
const status = document.getElementById('status');
const cursorRing = document.getElementById('cursorRing');

let img = new Image();
let originalImageData = null; // pristine pixels, for "restore" mode & reset
let history = [];
let historyLimit = 30;
let mode = 'erase';
let drawing = false;
let lastPt = null;
let zoom = 1;
let fileName = 'image';

function setStatus(msg) { status.textContent = msg; }

function loadImageFile(file) {
  fileName = file.name.replace(/\.[^.]+$/, '') || 'image';
  const url = URL.createObjectURL(file);
  img = new Image();
  img.onload = () => {
    stage.width = img.naturalWidth;
    stage.height = img.naturalHeight;
    ctx.clearRect(0, 0, stage.width, stage.height);
    ctx.drawImage(img, 0, 0);
    originalImageData = ctx.getImageData(0, 0, stage.width, stage.height);
    history = [];
    applyZoom();
    setStatus(`Image chargée: ${img.naturalWidth}x${img.naturalHeight}`);
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadImageFile(e.target.files[0]);
});

canvasWrap.addEventListener('dragover', e => e.preventDefault());
canvasWrap.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) loadImageFile(f);
});

function applyZoom() {
  zoom = parseInt(zoomInput.value, 10) / 100;
  stage.style.width = (stage.width * zoom) + 'px';
  stage.style.height = (stage.height * zoom) + 'px';
}
zoomInput.addEventListener('input', () => {
  zoomVal.textContent = zoomInput.value;
  applyZoom();
});

brushSize.addEventListener('input', () => {
  brushVal.textContent = brushSize.value;
});

function setMode(m) {
  mode = m;
  modeErase.classList.toggle('active', m === 'erase');
  modeRestore.classList.toggle('active', m === 'restore');
  modeErase.style.background = m === 'erase' ? '#3d7eff' : '#555';
  modeRestore.style.background = m === 'restore' ? '#3d7eff' : '#555';
}
modeErase.addEventListener('click', () => setMode('erase'));
modeRestore.addEventListener('click', () => setMode('restore'));
setMode('erase');

function pushHistory() {
  if (!stage.width) return;
  history.push(ctx.getImageData(0, 0, stage.width, stage.height));
  if (history.length > historyLimit) history.shift();
}

function undo() {
  if (history.length === 0) return;
  const prev = history.pop();
  ctx.putImageData(prev, 0, 0);
}
undoBtn.addEventListener('click', undo);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    undo();
  }
});

resetBtn.addEventListener('click', () => {
  if (!originalImageData) return;
  pushHistory();
  ctx.putImageData(originalImageData, 0, 0);
  setStatus('Image réinitialisée.');
});

function getCanvasPoint(e) {
  const rect = stage.getBoundingClientRect();
  const scaleX = stage.width / rect.width;
  const scaleY = stage.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function brushAt(pt) {
  const r = parseInt(brushSize.value, 10) / 2;
  if (mode === 'erase') {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else {
    // restore: paint original pixels back within the brush circle
    if (!originalImageData) return;
    const x0 = Math.max(0, Math.floor(pt.x - r));
    const y0 = Math.max(0, Math.floor(pt.y - r));
    const x1 = Math.min(stage.width, Math.ceil(pt.x + r));
    const y1 = Math.min(stage.height, Math.ceil(pt.y + r));
    const w = x1 - x0, h = y1 - y0;
    if (w <= 0 || h <= 0) return;
    const current = ctx.getImageData(x0, y0, w, h);
    const orig = originalImageData.data;
    const stageW = stage.width;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const gx = x0 + x, gy = y0 + y;
        const dx = gx - pt.x, dy = gy - pt.y;
        if (dx * dx + dy * dy <= r * r) {
          const di = (y * w + x) * 4;
          const si = (gy * stageW + gx) * 4;
          current.data[di] = orig[si];
          current.data[di + 1] = orig[si + 1];
          current.data[di + 2] = orig[si + 2];
          current.data[di + 3] = orig[si + 3];
        }
      }
    }
    ctx.putImageData(current, x0, y0);
  }
}

function lineBrush(a, b) {
  const dist = Math.hypot(b.x - a.x, b.y - a.y);
  const step = Math.max(1, parseInt(brushSize.value, 10) / 4);
  const steps = Math.max(1, Math.ceil(dist / step));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    brushAt({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  }
}

stage.addEventListener('pointerdown', e => {
  if (!stage.width) return;
  drawing = true;
  pushHistory();
  const pt = getCanvasPoint(e);
  lastPt = pt;
  brushAt(pt);
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  updateCursorRing(e);
  if (!drawing) return;
  const pt = getCanvasPoint(e);
  lineBrush(lastPt, pt);
  lastPt = pt;
});
stage.addEventListener('pointerup', () => drawing = false);
stage.addEventListener('pointerleave', () => drawing = false);

function updateCursorRing(e) {
  const size = parseInt(brushSize.value, 10) * zoom;
  cursorRing.style.width = size + 'px';
  cursorRing.style.height = size + 'px';
  cursorRing.style.left = (e.clientX - size / 2) + 'px';
  cursorRing.style.top = (e.clientY - size / 2) + 'px';
}
canvasWrap.addEventListener('pointermove', updateCursorRing);
canvasWrap.addEventListener('pointerenter', () => cursorRing.style.display = 'block');
canvasWrap.addEventListener('pointerleave', () => cursorRing.style.display = 'none');

cropBtn.addEventListener('click', () => {
  if (!stage.width) return;
  const data = ctx.getImageData(0, 0, stage.width, stage.height);
  const { data: d, width: w, height: h } = data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const a = d[(y * w + x) * 4 + 3];
      if (a > 10) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) { setStatus('Rien à rogner (image entièrement transparente).'); return; }
  const pad = 4;
  minX = Math.max(0, minX - pad);
  minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad);
  maxY = Math.min(h - 1, maxY + pad);
  const newW = maxX - minX + 1;
  const newH = maxY - minY + 1;
  const cropped = ctx.getImageData(minX, minY, newW, newH);
  pushHistory();
  stage.width = newW;
  stage.height = newH;
  ctx.putImageData(cropped, 0, 0);
  originalImageData = ctx.getImageData(0, 0, newW, newH);
  applyZoom();
  setStatus(`Rogné à ${newW}x${newH}`);
});

downloadBtn.addEventListener('click', () => {
  stage.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName + '-detoure.png';
    a.click();
  }, 'image/png');
});
</script>
</body>
</html>
