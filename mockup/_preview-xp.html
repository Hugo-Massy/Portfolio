<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>.reveal{opacity:1!important}body{overflow:auto}</style>
</head><body><div id="app">
<section class="xp" id="xp">
  <div class="wrap xp-wrap">

    <div class="xp-head reveal d1">
      <span class="section-tag"><span class="section-tag-num">03</span><span data-i18n="xp-tag-slug">_expérience/</span></span>
      <h2 data-i18n="xp-h2">Mes <span class="accent">projets</span>, en conditions réelles.</h2>
      <p class="xp-lede" data-i18n="xp-lede">Ce que j'ai conçu, déployé et sécurisé — en alternance à la DSI de Massy comme sur ma propre infrastructure.</p>
    </div>

    <!-- Structure bento reproduite à l'identique de la capture : 6 blocs vides.
         Placement via .xp-a-* (grid-template-areas), couleur via .xp-tile--*. -->
    <div class="xp-bento-track">
      <div class="xp-bento-stick">
        <div class="xp-bento">
          <article class="xp-tile xp-a-cust   xp-tile--b3"></article>
          <article class="xp-tile xp-a-sched  xp-tile--b1"></article>
          <article class="xp-tile xp-a-wallet xp-tile--b2"></article>
          <article class="xp-tile xp-a-inbox  xp-tile--b3"></article>
          <article class="xp-tile xp-a-send   xp-tile--b1"></article>
          <article class="xp-tile xp-a-remind xp-tile--b2"></article>
        </div>
      </div>
    </div>

  </div>
</section>

</div></body></html>
