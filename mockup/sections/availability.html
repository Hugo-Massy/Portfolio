<section class="availability" id="availability">
  <div class="wrap avail-wrap">

    <div class="avail-head reveal d1">
      <span class="section-tag"><span class="section-tag-num">04</span><span data-i18n="avail-tag-slug">_disponibilité/</span></span>
      <h2 data-i18n="avail-h2">Ma <span class="accent">disponibilité</span>, en un coup d'œil.</h2>
      <p class="avail-lede" data-i18n="avail-lede">Mon rythme d'alternance et mes prochaines échéances — pour savoir quand on peut travailler ensemble.</p>
    </div>

    <div class="avail-grid">

      <!-- Calendrier — fenêtre sombre façon terminal, rempli par initAvailability() dans js/main.js -->
      <div class="avail-calendar reveal d2">
        <div class="term-bar">
          <div class="term-dots">
            <div class="term-dot" style="background-color:#ff5f57"></div>
            <div class="term-dot" style="background-color:#febc2e"></div>
            <div class="term-dot" style="background-color:#28c840"></div>
          </div>
          <span class="term-bar-title">hugo@portfolio: ~/agenda</span>
        </div>

        <div class="cal-toolbar">
          <div class="cal-nav-group">
            <button type="button" class="cal-nav" id="cal-prev" aria-label="Mois précédent" data-i18n-attr="aria-label:avail-prev">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h3 class="cal-title" id="cal-title" aria-live="polite">—</h3>
            <button type="button" class="cal-nav" id="cal-next" aria-label="Mois suivant" data-i18n-attr="aria-label:avail-next">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          <button type="button" class="cal-today" id="cal-today" data-i18n="avail-today">Aujourd'hui</button>
        </div>

        <div class="cal-weekdays" id="cal-weekdays" aria-hidden="true"></div>
        <div class="cal-body">
          <div class="cal-rail" id="cal-rail" aria-hidden="true"></div>
          <div class="cal-grid" id="cal-grid" role="grid"></div>
        </div>

        <ul class="cal-legend">
          <li><span class="cal-key-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg></span><span data-i18n="avail-legend-ecole">Semaine école</span></li>
          <li><span class="cal-key cal-key--event"></span><span data-i18n="avail-legend-event">Échéance clé</span></li>
          <li><span class="cal-key cal-key--unavailable"></span><span data-i18n="avail-legend-unavailable">Indisponible</span></li>
        </ul>
      </div>

    </div>
  </div>
</section>
